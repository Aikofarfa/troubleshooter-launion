<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TROUBLESHOOTER · Soporte Técnico I.E. La Unión</title>
<meta name="description" content="Diagnóstico guiado y reportes de soporte técnico para I.E. La Unión. Los tickets llegan a sebascastroj70@gmail.com.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --cyan:#00c2ff; --cyan-dark:#0090c4; --navy:#0b1220; --navy2:#111a2e;
  --light:#eef4fb; --muted:#8fa3bd; --ok:#22c55e; --warn:#f59e0b; --danger:#ef4444;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:Poppins,system-ui,sans-serif;background:var(--navy);color:var(--light);overflow-x:hidden}
::selection{background:var(--cyan);color:var(--navy)}
button,[role=button]{cursor:pointer}
nav{position:fixed;top:0;width:100%;z-index:100;display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:14px 6vw;background:rgba(11,18,32,.88);backdrop-filter:blur(14px);border-bottom:1px solid rgba(0,194,255,.15)}
.logo{display:flex;align-items:center;gap:12px;font-weight:800;font-size:1.05rem;color:inherit;text-decoration:none}
.logo .mark{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,var(--cyan),#0077ff);
  display:flex;align-items:center;justify-content:center;box-shadow:0 0 22px rgba(0,194,255,.45);flex-shrink:0}
.logo b{color:var(--cyan)}
.nav-links{display:flex;gap:28px;list-style:none}
.nav-links a{color:var(--muted);text-decoration:none;font-size:.9rem;font-weight:500}
.nav-links a:hover{color:var(--cyan)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 24px;border-radius:50px;font-weight:600;font-size:.9rem;text-decoration:none;transition:.25s;border:none;font-family:inherit;min-height:44px}
.btn-primary{background:linear-gradient(135deg,var(--cyan),#0077ff);color:#fff;box-shadow:0 8px 24px rgba(0,194,255,.35)}
.btn-primary:hover{transform:translateY(-2px)}
.btn-ghost{background:transparent;color:var(--cyan);border:1.5px solid rgba(0,194,255,.5)}
.menu-btn{display:none;background:transparent;border:1.5px solid rgba(0,194,255,.4);color:var(--cyan);width:44px;height:44px;border-radius:12px;font-size:1.2rem}
@media(max-width:820px){
  .nav-links,.nav-cta{display:none}
  .menu-btn{display:inline-flex;align-items:center;justify-content:center}
  .nav-links.open{display:flex;flex-direction:column;position:absolute;top:72px;left:0;right:0;background:rgba(11,18,32,.96);padding:16px 6vw 24px;border-bottom:1px solid rgba(0,194,255,.15);gap:8px}
  .nav-links.open a{display:flex;min-height:44px;align-items:center}
}
header{min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;position:relative;padding:120px 6vw 60px}
.hero-bg{position:absolute;inset:0;overflow:hidden;z-index:0;pointer-events:none}
.hero-bg::before,.hero-bg::after{content:'';position:absolute;border-radius:50%}
.hero-bg::before{width:600px;height:600px;background:radial-gradient(circle,rgba(0,194,255,.18),transparent 65%);top:-150px;left:-150px}
.hero-bg::after{width:500px;height:500px;background:radial-gradient(circle,rgba(0,119,255,.14),transparent 65%);bottom:-120px;right:-100px}
.grid-lines{position:absolute;inset:0;background-image:linear-gradient(rgba(0,194,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(0,194,255,.05) 1px,transparent 1px);background-size:48px 48px;z-index:0;pointer-events:none}
.hero-content{position:relative;z-index:2;max-width:900px}
.badge{display:inline-flex;align-items:center;gap:8px;padding:8px 18px;border-radius:50px;background:rgba(0,194,255,.1);border:1px solid rgba(0,194,255,.3);color:var(--cyan);font-size:.78rem;font-weight:600;letter-spacing:1.4px;margin-bottom:26px;text-transform:uppercase}
.badge .dot{width:8px;height:8px;border-radius:50%;background:var(--ok)}
h1{font-size:clamp(2.2rem,6vw,4rem);font-weight:800;line-height:1.12;margin-bottom:22px}
h1 .grad{background:linear-gradient(90deg,var(--cyan),#7ee0ff,#0077ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero-content p{color:var(--muted);font-size:1.05rem;max-width:640px;margin:0 auto 36px;line-height:1.7}
.hero-btns{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.stats{display:flex;gap:40px;justify-content:center;margin-top:56px;flex-wrap:wrap}
.stat .num{font-size:2rem;font-weight:800;color:var(--cyan);font-family:'JetBrains Mono',monospace}
.stat .lbl{font-size:.78rem;color:var(--muted);letter-spacing:1px;text-transform:uppercase}
section{padding:90px 6vw;max-width:1200px;margin:0 auto}
.sec-tag{color:var(--cyan);font-family:'JetBrains Mono',monospace;font-size:.82rem;letter-spacing:2px;text-transform:uppercase;margin-bottom:10px}
h2{font-size:clamp(1.7rem,4vw,2.5rem);font-weight:700;margin-bottom:14px}
.sec-desc{color:var(--muted);max-width:640px;line-height:1.7;margin-bottom:40px}
.wizard{background:linear-gradient(145deg,var(--navy2),#0d1526);border:1px solid rgba(0,194,255,.2);border-radius:24px;padding:40px;box-shadow:0 24px 60px rgba(0,0,0,.45);position:relative;overflow:hidden}
.wizard::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--cyan),#0077ff)}
.progress{display:flex;align-items:center;gap:8px;margin-bottom:28px}
.progress .bar{flex:1;height:6px;border-radius:10px;background:rgba(255,255,255,.08);overflow:hidden}
.progress .bar i{display:block;height:100%;width:20%;background:linear-gradient(90deg,var(--cyan),#0077ff);transition:width .4s ease}
.progress .step-num{font-family:'JetBrains Mono',monospace;color:var(--cyan);font-size:.82rem;white-space:nowrap}
.q-title{font-size:1.25rem;font-weight:600;margin-bottom:10px;display:flex;align-items:center;gap:14px}
.q-sub{color:var(--muted);margin:0 0 22px 58px;font-size:.92rem;line-height:1.5}
.q-title .icon{width:44px;height:44px;border-radius:12px;background:rgba(0,194,255,.12);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.opt{background:rgba(255,255,255,.04);border:1.5px solid rgba(143,163,189,.25);border-radius:16px;padding:18px 20px;display:flex;align-items:flex-start;gap:14px;font-size:.95rem;font-weight:500;text-align:left;color:var(--light);font-family:inherit;width:100%}
.opt:hover{border-color:var(--cyan);background:rgba(0,194,255,.08);transform:translateY(-2px)}
.opt .oicon{width:40px;height:40px;border-radius:10px;background:rgba(0,194,255,.15);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.opt small{display:block;color:var(--muted);font-weight:400;margin-top:4px;font-size:.8rem}
.result{border-radius:16px;padding:26px;margin-bottom:18px;border:1.5px solid}
.result.ok{border-color:rgba(34,197,94,.5);background:rgba(34,197,94,.08)}
.result.warn{border-color:rgba(245,158,11,.5);background:rgba(245,158,11,.08)}
.result h3{font-size:1.12rem;margin-bottom:10px}
.result.ok h3{color:var(--ok)}.result.warn h3{color:var(--warn)}
.result ol{margin-left:20px;color:#c8d6e8;line-height:1.85;font-size:.95rem}
.result p{color:#c8d6e8;line-height:1.7;margin-bottom:10px}
.wiz-actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:22px}
.back-link{background:none;border:none;color:var(--muted);font-family:inherit;font-size:.85rem;text-decoration:underline}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px}
.card{background:linear-gradient(145deg,var(--navy2),#0d1526);border:1px solid rgba(143,163,189,.15);border-radius:20px;padding:26px}
.card:hover{border-color:rgba(0,194,255,.45);transform:translateY(-4px)}
.card.guide-card{width:100%;text-align:left;color:inherit;font:inherit;cursor:pointer;transition:.25s}
.card.guide-card:focus-visible{outline:3px solid var(--cyan);outline-offset:3px}
.guide-inline{margin-top:22px;padding-top:20px;border-top:1px solid rgba(0,194,255,.25);cursor:default}
.guide-inline h4{color:var(--cyan);font-size:1rem;margin-bottom:8px}
.guide-inline p{color:#c8d6e8;line-height:1.65;margin-bottom:12px}
.guide-inline ol{margin:0 0 14px 22px;color:#c8d6e8;line-height:1.8}
.guide-tip,.guide-next{padding:11px 13px;border-radius:12px;margin-top:10px;font-size:.84rem;line-height:1.55}
.guide-tip{background:rgba(0,194,255,.08);border:1px solid rgba(0,194,255,.2)}
.guide-next{background:rgba(245,158,11,.08);border:1px solid rgba(245,158,11,.25)}
.guide-inline .close-guide{margin-top:16px}
.card .cicon{width:48px;height:48px;border-radius:14px;background:linear-gradient(135deg,rgba(0,194,255,.2),rgba(0,119,255,.15));display:flex;align-items:center;justify-content:center;margin-bottom:14px;font-size:1.3rem}
.card h3{font-size:1.05rem;margin-bottom:8px}
.card p{color:var(--muted);font-size:.9rem;line-height:1.65}
.tag{display:inline-block;margin-top:12px;padding:5px 12px;border-radius:20px;font-size:.72rem;font-weight:600}
.tag.easy{background:rgba(34,197,94,.15);color:var(--ok)}
.tag.med{background:rgba(245,158,11,.15);color:var(--warn)}
.tag.hard{background:rgba(239,68,68,.15);color:var(--danger)}
.form-wrap{background:linear-gradient(145deg,var(--navy2),#0d1526);border:1px solid rgba(0,194,255,.2);border-radius:24px;padding:40px;box-shadow:0 24px 60px rgba(0,0,0,.45);position:relative;overflow:hidden}
.form-wrap::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,#0077ff,var(--cyan))}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.form-grid .full{grid-column:1/-1}
label{display:block;font-size:.82rem;font-weight:600;color:var(--muted);margin-bottom:8px}
input,select,textarea{width:100%;background:rgba(255,255,255,.05);border:1.5px solid rgba(143,163,189,.3);border-radius:12px;padding:14px 16px;color:var(--light);font-family:inherit;font-size:.92rem;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--cyan);box-shadow:0 0 0 4px rgba(0,194,255,.12)}
textarea{min-height:120px;resize:vertical}
select option{background:var(--navy2)}
.urgency{display:flex;flex-wrap:wrap;gap:8px}
.urg{min-height:42px;border-radius:999px;border:1.5px solid rgba(143,163,189,.3);background:transparent;color:var(--muted);padding:0 16px;font-family:inherit;font-weight:600;font-size:.85rem;text-transform:capitalize}
.urg.on.baja{border-color:rgba(34,197,94,.5);background:rgba(34,197,94,.15);color:var(--ok)}
.urg.on.media{border-color:rgba(245,158,11,.5);background:rgba(245,158,11,.15);color:var(--warn)}
.urg.on.alta{border-color:rgba(239,68,68,.5);background:rgba(239,68,68,.15);color:var(--danger)}
.form-note{display:flex;align-items:flex-start;gap:8px;color:var(--muted);font-size:.8rem;margin-top:16px;line-height:1.5}
.notice{display:none;border-radius:16px;padding:14px 16px;margin-bottom:18px;font-size:.92rem;line-height:1.55}
.notice.show{display:block}
.notice.ok{border:1px solid rgba(34,197,94,.4);background:rgba(34,197,94,.1);color:var(--ok)}
.notice.warn{border:1px solid rgba(245,158,11,.4);background:rgba(245,158,11,.1);color:var(--warn)}
.notice.err{border:1px solid rgba(239,68,68,.4);background:rgba(239,68,68,.1);color:#ff8b8b}
.hp{position:absolute;left:-9999px;height:0;width:0;overflow:hidden}
footer{border-top:1px solid rgba(0,194,255,.15);padding:44px 6vw;text-align:center;color:var(--muted);font-size:.85rem}
footer b{color:var(--cyan)}
footer p{line-height:1.8}
@media(max-width:700px){.form-grid{grid-columns:1fr;grid-template-columns:1fr}.wizard,.form-wrap{padding:24px}.q-sub{margin-left:0}}
</style>
</head>

</html>
