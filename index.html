<div class="card">  
  <h3>¿No se solucionó? Envía un reporte</h3>  
  <form action="https://formspree.io/f/mdekngye" method="POST">  
    <input type="text" name="nombre" placeholder="Tu nombre" required>  
    <select name="rol" required>  
      <option value="">¿Eres estudiante o docente?</option>  
      <option value="Estudiante">Estudiante</option>  
      <option value="Docente">Docente</option>  
    </select>  
    <input type="text" name="salon" placeholder="Salón / Aula" required>  
    <textarea name="falla" placeholder="Describe qué pasa..." required></textarea>  
    <button type="submit" class="btn-enviar">Enviar Reporte</button>  
  </form>  
</div>
